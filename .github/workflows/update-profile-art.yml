name: Update profile art

# Re-scrapes your public contribution graph and re-renders contrib-heatmap.svg
# every day. No token, no secrets -- it reads the same public HTML the profile
# page uses. Also runnable on demand from the Actions tab.

on:
  schedule:
    - cron: "17 6 * * *"   # daily ~06:17 UTC (off the :00 rush)
  workflow_dispatch: {}

# lets the job push the regenerated SVG back to the repo
permissions:
  contents: write

concurrency:
  group: update-profile-art
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      GH_PROFILE_USER: Sangwaniya
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install scraper deps
        run: pip install -r scripts/requirements.txt

      - name: Fetch contributions
        run: python scripts/fetch_contributions.py

      - name: Render heatmap
        run: python scripts/render_heatmap_svg.py

      - name: Commit changes if any
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh contribution graph [skip ci]"
            git push
          fi
